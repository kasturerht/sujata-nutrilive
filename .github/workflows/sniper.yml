name: 🎯 Sujata AI Sniper 24/7 Radar

on:
  schedule:
    # Runs every 1 hour automatically in GitHub Cloud 24/7
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub website

jobs:
  radar-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run AI Sniper Radar Scan
        env:
          TELEGRAM_BOT_TOKEN: "8922846279:AAFZXUeM6lZc4t0x1AtKjOwPHAE0IBeugSI"
          TELEGRAM_CHAT_ID: "847419012"
        run: npm run sniper
