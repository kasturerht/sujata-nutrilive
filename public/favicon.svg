<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Luxury Emerald Base Gradient -->
    <radialGradient id="emeraldBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="60%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#011812"/>
    </radialGradient>

    <!-- Warm Royal Gold Metallic Gradient -->
    <linearGradient id="royalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Emerald Leaf Glow -->
    <linearGradient id="emeraldLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Circular Luxury Seal Background -->
  <rect width="512" height="512" rx="128" fill="url(#emeraldBg)"/>
  
  <!-- Outer Gold Micro-Border -->
  <rect x="16" y="16" width="480" height="480" rx="116" stroke="url(#royalGold)" stroke-width="8" stroke-opacity="0.6"/>

  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="210" stroke="url(#royalGold)" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.3"/>

  <!-- Botanical Spirulina Vitality Icon (Stylized 'S' + Double Leaf Helix) -->
  <g transform="translate(0,0)">
    <!-- Right Golden Leaf Arc (Sun Vitality) -->
    <path d="M256 96 C344 96, 400 160, 400 240 C400 320, 330 360, 270 380 C210 400, 160 410, 160 416 C160 416, 220 440, 290 410 C360 380, 416 310, 416 230 C416 130, 340 76, 256 76 Z" 
          fill="url(#royalGold)"/>

    <!-- Left Emerald Bio-Algae Helix Leaf -->
    <path d="M256 416 C168 416, 112 352, 112 272 C112 192, 182 152, 242 132 C302 112, 352 102, 352 96 C352 96, 292 72, 222 102 C152 132, 96 202, 96 282 C96 382, 172 436, 256 436 Z" 
          fill="url(#emeraldLeaf)"/>

    <!-- Central Royal Monogram 'S' (Playfair Styling) -->
    <path d="M280 170 C280 170, 225 170, 205 195 C185 220, 200 245, 235 260 L275 278 C315 296, 330 325, 310 355 C285 390, 215 390, 215 390 M230 170 C230 170, 290 170, 305 185" 
          stroke="url(#royalGold)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Vitality Spark / Star Core -->
    <circle cx="340" cy="150" r="14" fill="url(#royalGold)"/>
  </g>
</svg>
